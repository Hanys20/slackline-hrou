<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stránka nenalezena – Slackline Hrou</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/assets/images/icons/SVG_Ikona-hlava.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" /></noscript>
  <link rel="stylesheet" href="/assets/css/variables.min.css" />
  <link rel="stylesheet" href="/assets/css/nav.min.css" />
  <link rel="stylesheet" href="/assets/css/homepage.min.css" />
  <style>
    .error-page {
      min-height: calc(100dvh - var(--nav-height) - 120px);
      display: flex;
      align-items: center;
      padding: var(--space-16) 0 var(--space-20);
      background: var(--color-cream);
      overflow: hidden;
      position: relative;
    }

    /* Dekorativní kruhy v pozadí */
    .error-page::before,
    .error-page::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }
    .error-page::before {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, var(--color-green-pale) 0%, transparent 70%);
      top: -100px;
      right: -100px;
      opacity: 0.6;
    }
    .error-page::after {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, #EFE8D8 0%, transparent 70%);
      bottom: -60px;
      left: -60px;
      opacity: 0.8;
    }

    .error-inner {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-12);
      align-items: center;
      position: relative;
      z-index: 1;
    }

    /* ── Levá část – text ── */
    .error-content {}

    .error-code {
      font-family: var(--font-display);
      font-size: clamp(7rem, 18vw, 13rem);
      line-height: 1;
      color: var(--color-brown);
      letter-spacing: -0.03em;
      margin-bottom: var(--space-2);
      position: relative;
    }
    .error-code .zero {
      color: var(--color-green);
      display: inline-block;
      animation: wobble 3s ease-in-out infinite;
    }
    @keyframes wobble {
      0%, 100% { transform: rotate(-3deg) translateY(0); }
      50%       { transform: rotate(3deg)  translateY(-6px); }
    }

    .error-heading {
      font-family: var(--font-display);
      font-size: clamp(var(--text-2xl), 4vw, var(--text-4xl));
      color: var(--color-brown);
      line-height: 1.2;
      margin-bottom: var(--space-4);
      text-transform: uppercase;
    }

    .error-sub {
      font-size: var(--text-lg);
      color: var(--color-text-light);
      line-height: 1.7;
      margin-bottom: var(--space-8);
      max-width: 420px;
    }

    .error-actions {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-3);
    }

    .error-links {
      margin-top: var(--space-8);
      padding-top: var(--space-6);
      border-top: 1.5px solid var(--color-beige-dark);
    }
    .error-links-label {
      font-size: var(--text-xs);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-text-light);
      margin-bottom: var(--space-3);
    }
    .error-links-list {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2) var(--space-5);
      list-style: none;
      padding: 0;
    }
    .error-links-list a {
      font-size: var(--text-sm);
      font-weight: 700;
      color: var(--color-green);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: var(--space-1);
      transition: color var(--transition-fast);
    }
    .error-links-list a:hover { color: var(--color-green-dark); }
    .error-links-list a::before { content: '→'; font-size: 0.9em; }

    /* ── Pravá část – maskot ── */
    .error-mascot {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .error-mascot-wrap {
      position: relative;
      max-width: 360px;
      width: 100%;
    }

    .error-mascot-blob {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 55% 45% 50% 50% / 48% 52% 48% 52%;
      background: var(--color-beige);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-12px); }
    }

    .error-mascot-blob img {
      width: 72%;
      height: auto;
      display: block;
    }

    .error-bubble {
      position: absolute;
      z-index: 10;
      top: 6%;
      left: -5%;
      background: var(--color-white);
      border-radius: var(--radius-xl);
      padding: var(--space-3) var(--space-4);
      box-shadow: var(--shadow-md);
      font-size: var(--text-sm);
      font-weight: 700;
      color: var(--color-brown);
      white-space: nowrap;
      border: 1.5px solid var(--color-beige-dark);
      animation: float 4s ease-in-out infinite 0.5s;
    }
    .error-bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      right: 20px;
      width: 16px;
      height: 16px;
      background: var(--color-white);
      border-right: 1.5px solid var(--color-beige-dark);
      border-bottom: 1.5px solid var(--color-beige-dark);
      transform: rotate(45deg);
      clip-path: polygon(0 0, 100% 0, 100% 100%);
    }

    /* ── Responzivita ── */
    @media (max-width: 768px) {
      .error-inner {
        grid-template-columns: 1fr;
        text-align: center;
        gap: var(--space-8);
      }
      .error-mascot { order: -1; }
      .error-mascot-wrap { max-width: 240px; margin: 0 auto; }
      .error-sub { margin-left: auto; margin-right: auto; }
      .error-actions { justify-content: center; }
      .error-links-list { justify-content: center; }
      .error-bubble { font-size: var(--text-xs); left: 0; }
      .error-code { font-size: clamp(5rem, 22vw, 7rem); }
    }
  </style>
</head>
<body>

<div id="site-nav"></div>

<main>
  <section class="error-page" aria-labelledby="error-title">
    <div class="container">
      <div class="error-inner">

        <!-- Levá část – text -->
        <div class="error-content">
          <div class="error-code" aria-label="Chyba 404">
            4<span class="zero">0</span>4
          </div>
          <h1 class="error-heading" id="error-title">
            Tahle stránka se<br>ztratila na lajně.
          </h1>
          <p class="error-sub">
            Buď adresa neexistuje, nebo se stránka přestěhovala.
            Žádný stres – rovnováhu znovu najdeme na hlavní stránce.
          </p>
          <div class="error-actions">
            <a href="/index.html" class="btn btn-primary btn-lg">Zpět na hlavní stránku</a>
            <a href="/index.html#kontakt" class="btn btn-outline btn-lg">Poptat program</a>
          </div>

          <nav class="error-links" aria-label="Rychlé odkazy">
            <div class="error-links-label">Nebo mrkni sem</div>
            <ul class="error-links-list">
              <li><a href="/pages/pro-skoly.html">Pro školy</a></li>
              <li><a href="/pages/pro-firmy.html">Pro firmy</a></li>
              <li><a href="/pages/pro-verejnost.html">Pro veřejnost</a></li>
              <li><a href="/pages/o-mne.html">O mně</a></li>
              <li><a href="/pages/o-slackline.html">O slackline</a></li>
            </ul>
          </nav>
        </div>

        <!-- Pravá část – lenochod -->
        <div class="error-mascot" aria-hidden="true">
          <div class="error-mascot-wrap">
            <div class="error-bubble">Hmm… tady nic není</div>
            <div class="error-mascot-blob">
              <img src="/assets/images/icons/SVG_FAQ.svg" alt="" loading="lazy" width="220" height="220" />
            </div>
          </div>
        </div>

      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="/assets/js/components.js"></script>
<script src="/assets/js/main.min.js"></script>
</body>
</html>
